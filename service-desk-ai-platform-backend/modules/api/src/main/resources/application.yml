spring:
  application:
    name: service-desk-ai-platform
  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/servicedesk_ai}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    drop-first: false

  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 30s
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 30s
      pool:
        core-size: 10
        max-size: 50
        queue-capacity: 1000
        keep-alive: 60s
      thread-name-prefix: async-ingestion-

# ──────────────────────── STORAGE ────────────────────────
storage:
  type: LOCAL_FILE_SYSTEM
  local:
    root-path: ${STORAGE_ROOT_PATH:./storage}
    document-folder: ${STORAGE_DOC_FOLDER:documents}
    knowledge-folder: ${STORAGE_KNOWLEDGE_FOLDER:knowledge}
    temp-folder: ${STORAGE_TEMP_FOLDER:temp}
    archive-folder: ${STORAGE_ARCHIVE_FOLDER:archive}
    failed-folder: ${STORAGE_FAILED_FOLDER:failed}
    max-file-size-bytes: 104857600 # 100MB

# ──────────────────────── AI / LLM / EMBEDDING ────────────────────────
ai:
  llm:
    provider: GEMINI
    model-name: gemini-3.6-flash
    api-key: ${GEMINI_API_KEY:}
  embedding:
    provider: GEMINI
    model-name: gemini-embedding-001
    dimension: 1024
  pinecone:
    api-key: ${AI_PINECONE_API_KEY:}
    host: ${AI_PINECONE_HOST:}
    index-name: servicedesk-knowledge
    dimension: 1024
    namespace-prefix: ""

# ──────────────────────── SERVICENOW ────────────────────────
servicenow:
  instance-url: ${SERVICENOW_INSTANCE_URL:}
  client-id: ${SERVICENOW_CLIENT_ID:}
  client-secret: ${SERVICENOW_CLIENT_SECRET:}
  username: ${SERVICENOW_USERNAME:}
  password: ${SERVICENOW_PASSWORD:}
  auth-mode: ${SERVICENOW_AUTH_MODE:OAuth2.0 Bearer}
  system-of-record: ${SERVICENOW_SYSTEM_OF_RECORD:ServiceNow ITSM & Knowledge}
  connection-timeout-ms: 5000
  read-timeout-ms: 15000

# ──────────────────────── SCHEDULER ────────────────────────
scheduler:
  servicenow:
    enabled: ${SCHEDULER_SERVICENOW_ENABLED:true}
    cron: ${SCHEDULER_SERVICENOW_CRON:0 0 2 * * ?}   # daily at 2 AM
    sync-limit: ${SCHEDULER_SERVICENOW_SYNC_LIMIT:500} # max records per sync run
    lookback-seconds: ${SCHEDULER_SERVICENOW_LOOKBACK_SECONDS:86400} # 24 hours (1 day)

# ──────────────────────── RESILIENCE4J ────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      serviceNowApi:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      serviceNowApi:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
          - com.servicedesk.ai.common.exception.IntegrationException

# ──────────────────────── SERVER ────────────────────────
server:
  port: 8080
  servlet:
    context-path: /
  shutdown: graceful
  forward-headers-strategy: framework

# ──────────────────────── MANAGEMENT ────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
