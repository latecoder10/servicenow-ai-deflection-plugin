openapi: 3.0.3
info:
  title: Enterprise AI Knowledge Synchronization Platform REST API
  description: Continuously synchronizes resolved ServiceNow incidents and knowledge articles into Pinecone AI index for real-time ticket deflection.
  version: 2.5.0-SNAPSHOT
  contact:
    name: Enterprise AI Platform Engineering
    email: platform-team@enterprise.com
servers:
  - url: http://localhost:8080
    description: Local Container Runtime
  - url: https://ai-servicedesk.internal.enterprise.com
    description: Production Enterprise Environment

paths:
  /api/v1/connectors:
    get:
      tags:
        - Connector Management
      summary: List all registered enterprise knowledge connector types
      responses:
        '200':
          description: List of available connector identifiers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: "SERVICENOW"

  /api/v1/connectors/{connectorType}/test:
    post:
      tags:
        - Connector Management
      summary: Test connection health for a specific connector
      parameters:
        - name: connectorType
          in: path
          required: true
          schema:
            type: string
            example: "SERVICENOW"
      responses:
        '200':
          description: Connection health test result

  /api/v1/connectors/{connectorType}/sync:
    post:
      tags:
        - Connector Management
      summary: Trigger full or incremental knowledge synchronization
      parameters:
        - name: connectorType
          in: path
          required: true
          schema:
            type: string
            example: "SERVICENOW"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: Asynchronous synchronization job started

  /api/v1/servicenow/sync/incremental:
    post:
      tags:
        - ServiceNow Integration
      summary: Trigger incremental synchronization for ServiceNow
      parameters:
        - name: workspace
          in: query
          schema:
            type: string
            default: "Enterprise IT"
        - name: sinceTimestampMs
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Sync execution initialized

  /api/v1/servicenow/attachments/metadata/{attachmentId}:
    get:
      tags:
        - ServiceNow Integration
      summary: Get ServiceNow attachment metadata reference (No binary duplicate)
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Attachment metadata reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentMetadata'

  /api/v1/servicenow/attachments/download/{attachmentId}:
    get:
      tags:
        - ServiceNow Integration
      summary: Proxy attachment download directly from ServiceNow Attachment API
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Binary attachment file stream

  /api/v1/knowledge/search:
    get:
      tags:
        - Knowledge Index
      summary: Semantic Search across synchronized Pinecone vector index
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: workspace
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: topK
          in: query
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: Search results from Pinecone

  /api/v1/suggestions/resolve:
    post:
      tags:
        - AI Deflection Engine
      summary: Generate real-time AI resolution suggestion to deflect ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveIncidentRequest'
      responses:
        '200':
          description: AI resolution suggestion with confidence score and references

  /api/v1/analytics/dashboard:
    get:
      tags:
        - Analytics & ROI
      summary: Get complete Executive Synchronization & AI Knowledge Layer Metrics Dashboard
      responses:
        '200':
          description: Metrics dashboard payload

components:
  schemas:
    SyncRequest:
      type: object
      properties:
        connectorType:
          type: string
          example: "SERVICENOW"
        syncType:
          type: string
          example: "INCREMENTAL"
        workspace:
          type: string
          example: "Enterprise IT"
        sinceTimestamp:
          type: string
          format: date-time

    AttachmentMetadata:
      type: object
      properties:
        attachmentSysId:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        fileSize:
          type: integer
        tableName:
          type: string
        recordSysId:
          type: string
        downloadUrl:
          type: string

    ResolveIncidentRequest:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
          example: "GlobalProtect VPN Connection Failed"
        description:
          type: string
          example: "SAML MFA Authentication error 50012"
        callerEmail:
          type: string
        userDepartment:
          type: string
        category:
          type: string
