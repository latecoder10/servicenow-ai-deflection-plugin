version: '3.8'

services:
  # Spring Boot Service Desk AI Backend Platform
  service-desk-ai-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servicedesk-ai-platform
    ports:
      - "8080:8080" # REST API
      - "8081:8081" # Actuator & Prometheus Metrics
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/servicedesk_ai
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-changeme}
      - SPRING_REDIS_HOST=redis
      - PINECONE_API_KEY=${PINECONE_API_KEY:-demo-pinecone-key}
      - SERVICENOW_INSTANCE_URL=${SERVICENOW_INSTANCE_URL:-https://demo.service-now.com}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-demo-gemini-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Relational Database for Audit Logs, Metadata & Metrics
  postgres:
    image: postgres:16-alpine
    container_name: servicedesk-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: servicedesk_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Distributed Cache & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: servicedesk-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Prometheus Telemetry Collector
  prometheus:
    image: prom/prometheus:latest
    container_name: servicedesk-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml

  # Grafana Analytics & Incident Deflection Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: servicedesk-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}

volumes:
  postgres_data:
